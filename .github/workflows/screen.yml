name: screen

on:
  schedule:
    - cron: "17 */6 * * *"   # four times a day; each run explores a new random batch
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: screen
  cancel-in-progress: false

jobs:
  # Parallel stability checks on the queue the previous run left (results/queue.json). Public
  # repo, so these minutes are free; six workers multiply the checks per run by about seven.
  shards:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - name: Check this shard's slice of the queue
        env:
          MP_API_KEY: ${{ secrets.MP_API_KEY }}
        run: python check_shard.py ${{ matrix.shard }} 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: shard_out
          if-no-files-found: ignore
          retention-days: 3

  screen:
    needs: shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shard_out
        continue-on-error: true
      - name: Run the screen
        env:
          MP_API_KEY: ${{ secrets.MP_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STRUCTURE_CHECKS_PER_RUN: "20"
          STRUCTURE_BUDGET_S: "3000"
        run: python run.py
      - name: Commit this run's results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git diff --cached --quiet || git commit -m "Screen results $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 10; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
